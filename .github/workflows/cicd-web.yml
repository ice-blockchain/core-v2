name: Web Build & Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - testnet
          - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve environment
        id: resolve
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ENV="${INPUT_ENVIRONMENT:-staging}"
          if [[ ! "$ENV" =~ ^(staging|testnet|production)$ ]]; then
            echo "::error::Invalid environment: $ENV"
            exit 1
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: resolve-env
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm turbo test

  build-and-deploy:
    name: Build & Deploy
    needs: [resolve-env, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve-env.outputs.environment }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout secrets
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ice-blockchain/core-v2-secrets
          ref: master
          token: ${{ secrets.ICE_CI_CD_BOT_GH_PAT }}
          path: frontend/.secrets

      - name: Mask secrets
        working-directory: .
        env:
          INPUT_ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
        run: |
          SECRETS_FILE="frontend/.secrets/frontend/${INPUT_ENVIRONMENT}/web/.env.secrets"
          if [[ -f "$SECRETS_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$value" || "$key" =~ ^# ]] && continue
              echo "::add-mask::${value}"
            done < "$SECRETS_FILE"
          fi

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup environment
        env:
          INPUT_ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
        run: ./scripts/setup-env.sh "$INPUT_ENVIRONMENT"

      - name: Verify web env
        run: |
          if [[ ! -f apps/web/.env ]]; then
            echo "::error::apps/web/.env missing after setup-env.sh — secrets repo may be missing web env files"
            exit 1
          fi

      - name: Build
        run: pnpm turbo build --filter=@ion/web...

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: web-${{ needs.resolve-env.outputs.environment }}
          path: frontend/apps/web/dist/
          retention-days: ${{ needs.resolve-env.outputs.environment == 'production' && 30 || 7 }}

      - name: Setup SSH and deploy
        env:
          INPUT_ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
        run: |
          # Source web deploy secrets (DEPLOY_SSH_KEY, DEPLOY_USER, DEPLOY_HOST, DEPLOY_PATH)
          SECRETS_FILE=".secrets/frontend/${INPUT_ENVIRONMENT}/web/.env.secrets"
          if [[ ! -f "$SECRETS_FILE" ]]; then
            echo "::error::Web secrets file not found: $SECRETS_FILE"
            exit 1
          fi
          set -a && source "$SECRETS_FILE" && set +a

          # Decode base64-encoded SSH private key
          mkdir -p ~/.ssh
          if [[ -z "$DEPLOY_SSH_KEY" ]]; then
            echo "::error::DEPLOY_SSH_KEY is empty — check secrets file"
            exit 1
          fi
          printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate key format
          if ! head -1 ~/.ssh/deploy_key | grep -q "BEGIN"; then
            echo "::error::Decoded key is not a valid PEM/OpenSSH key — check base64 encoding"
            exit 1
          fi

          # Add host key to known_hosts
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            apps/web/dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

          # Cleanup
          rm -f ~/.ssh/deploy_key
