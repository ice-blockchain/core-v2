name: Mobile Build & Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - testnet
          - production
      deployment_target:
        description: Deployment target
        required: true
        type: choice
        options:
          - firebase
          - store
      app_version:
        description: App version (e.g. 1.0.0)
        required: true
        default: "9.9.9"
        type: string

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate Inputs
    runs-on: getmac
    timeout-minutes: 1
    steps:
      - name: Validate inputs
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
        run: |
          if [[ ! "$INPUT_ENVIRONMENT" =~ ^(staging|testnet|production)$ ]]; then
            echo "::error::Invalid environment: $INPUT_ENVIRONMENT"
            exit 1
          fi
          if [[ ! "$INPUT_DEPLOYMENT_TARGET" =~ ^(firebase|store)$ ]]; then
            echo "::error::Invalid deployment target: $INPUT_DEPLOYMENT_TARGET"
            exit 1
          fi
          if [[ ! "$INPUT_APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $INPUT_APP_VERSION. Expected semver: X.Y.Z"
            exit 1
          fi

  verify:
    name: Verify
    needs: validate-inputs
    runs-on: getmac
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    outputs:
      android_flavor: ${{ steps.resolve.outputs.android_flavor }}
      ios_scheme: ${{ steps.resolve.outputs.ios_scheme }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm turbo test

      - name: Resolve build parameters
        id: resolve
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$INPUT_ENVIRONMENT" in
            staging)
              echo "android_flavor=staging" >> "$GITHUB_OUTPUT"
              echo "ios_scheme=Ion-Staging" >> "$GITHUB_OUTPUT"
              ;;
            testnet)
              echo "android_flavor=ionTestnet" >> "$GITHUB_OUTPUT"
              echo "ios_scheme=Ion-Testnet" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "android_flavor=production" >> "$GITHUB_OUTPUT"
              echo "ios_scheme=Ion-Production" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android
    needs: verify
    runs-on: getmac
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout secrets
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ice-blockchain/core-v2-secrets
          ref: master
          token: ${{ secrets.ICE_CI_CD_BOT_GH_PAT }}
          path: frontend/.secrets

      - name: Mask secrets
        working-directory: .
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          SECRETS_FILE="frontend/.secrets/frontend/${INPUT_ENVIRONMENT}/mobile/.env.secrets"
          if [[ -f "$SECRETS_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$value" || "$key" =~ ^# ]] && continue
              echo "::add-mask::${value}"
            done < "$SECRETS_FILE"
          fi

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup environment
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: ./scripts/setup-env.sh "$INPUT_ENVIRONMENT"

      - name: Build JS packages
        run: pnpm turbo build --filter=@ion/mobile...

      - name: Setup JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Fix Hermes permissions
        run: |
          find apps/mobile/node_modules -name "hermesc" -type f -exec chmod +x {} +
          find apps/mobile/node_modules -name "*.sh" -path "*/react-native/*" -exec chmod +x {} +

      - name: Setup Android SDK path
        run: |
          echo "::group::Runner environment diagnostics"
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "ANDROID_HOME=${ANDROID_HOME:-<not set>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<not set>}"
          echo "JAVA_HOME=${JAVA_HOME:-<not set>}"
          echo "::endgroup::"
          for candidate in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Library/Android/sdk" "/opt/homebrew/share/android-commandlinetools" "/usr/local/share/android-commandlinetools"; do
            if [[ -n "$candidate" && -d "$candidate" ]]; then
              echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
              echo "sdk.dir=$candidate" > apps/mobile/android/local.properties
              echo "Found Android SDK at: $candidate"
              ls "$candidate" || true
              exit 0
            fi
          done
          echo "::error::Android SDK not found. Install it on the runner or set ANDROID_HOME."
          echo "Searched: \$ANDROID_HOME, \$ANDROID_SDK_ROOT, \$HOME/Library/Android/sdk, /opt/homebrew/share/android-commandlinetools, /usr/local/share/android-commandlinetools"
          exit 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: frontend/packages/ton-storage/native/tonutils-storage-bridge/go.mod
          cache: false

      - name: Build tonutils-storage Android bridge
        working-directory: frontend/packages/ton-storage/native/tonutils-storage-bridge
        run: |
          OUT_DIR="../../android/src/main/jniLibs/arm64-v8a"
          OUT_SO="$OUT_DIR/libtonutils-storage.so"
          if [[ -f "$OUT_SO" ]]; then
            echo "tonutils-storage Android library already exists: $OUT_SO"
            exit 0
          fi

          if [[ -z "${ANDROID_HOME:-}" || ! -d "${ANDROID_HOME}/ndk" ]]; then
            echo "::error::ANDROID_HOME/ndk not found; cannot build tonutils-storage Android bridge."
            exit 1
          fi

          if [[ -z "${ANDROID_NDK_HOME:-}" ]]; then
            ANDROID_NDK_HOME="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -Vr | head -n 1)"
            export ANDROID_NDK_HOME
          fi

          if [[ -z "${ANDROID_NDK_HOME:-}" || ! -d "${ANDROID_NDK_HOME}" ]]; then
            echo "::error::Could not resolve ANDROID_NDK_HOME from ${ANDROID_HOME}/ndk."
            exit 1
          fi

          TOOLCHAIN=""
          for host in darwin-x86_64 darwin-arm64; do
            candidate="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/${host}/bin/aarch64-linux-android24-clang"
            if [[ -x "$candidate" ]]; then
              TOOLCHAIN="$candidate"
              break
            fi
          done
          if [[ -z "$TOOLCHAIN" ]]; then
            echo "::error::aarch64 Android clang toolchain not found under ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt."
            exit 1
          fi

          mkdir -p "$OUT_DIR"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="$TOOLCHAIN" \
            go build -buildmode=c-shared -o "$OUT_SO" .

          ls -lh "$OUT_SO"

      - name: Build Android
        working-directory: frontend/apps/mobile/android
        env:
          INPUT_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          ANDROID_FLAVOR: ${{ needs.verify.outputs.android_flavor }}
          BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
        run: |
          FLAVOR="$(echo "${ANDROID_FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${ANDROID_FLAVOR:1}"
          if [[ "$INPUT_DEPLOYMENT_TARGET" == "firebase" ]]; then
            ./gradlew "assemble${FLAVOR}Release" \
              -PversionName="$INPUT_APP_VERSION" \
              -PversionCode="$BUILD_NUMBER"
          else
            ./gradlew "bundle${FLAVOR}Release" \
              -PversionName="$INPUT_APP_VERSION" \
              -PversionCode="$BUILD_NUMBER"
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: frontend/apps/mobile

      - name: Deploy to Firebase
        if: inputs.deployment_target == 'firebase'
        working-directory: frontend/apps/mobile
        env:
          RELEASE_NOTES: "${{ inputs.environment }}_${{ github.head_ref || github.ref_name }}"
        run: bundle exec fastlane android distribute_firebase

      - name: Deploy to Play Store
        if: inputs.deployment_target == 'store'
        working-directory: frontend/apps/mobile
        run: bundle exec fastlane android distribute_playstore

  build-ios:
    name: Build iOS
    needs: verify
    runs-on: getmac
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout secrets
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ice-blockchain/core-v2-secrets
          ref: master
          token: ${{ secrets.ICE_CI_CD_BOT_GH_PAT }}
          path: frontend/.secrets

      - name: Mask secrets
        working-directory: .
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          SECRETS_FILE="frontend/.secrets/frontend/${INPUT_ENVIRONMENT}/mobile/.env.secrets"
          if [[ -f "$SECRETS_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$value" || "$key" =~ ^# ]] && continue
              echo "::add-mask::${value}"
            done < "$SECRETS_FILE"
          fi

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup environment
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: ./scripts/setup-env.sh "$INPUT_ENVIRONMENT"

      - name: Build JS packages
        run: pnpm turbo build --filter=@ion/mobile...

      - name: Setup Ruby
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: frontend/apps/mobile

      - name: Fix Hermes permissions
        run: |
          find apps/mobile/node_modules -name "hermesc" -type f -exec chmod +x {} +
          find apps/mobile/node_modules -name "*.sh" -path "*/react-native/*" -exec chmod +x {} +

      - name: Install CocoaPods
        working-directory: frontend/apps/mobile/ios
        run: |
          # CocoaPods 1.16.x can intermittently crash with:
          # "ArgumentError - pathname contains null byte" (CocoaPods/CocoaPods#12798).
          # Retry clean installs with aggressive cache cleanup when that specific flake appears.
          set -o pipefail
          ATTEMPT=1
          MAX_ATTEMPTS=6
          while [[ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]]; do
            echo "pod install attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            rm -rf ~/Library/Caches/CocoaPods ~/.cocoapods/repos/trunk
            rm -rf Pods Podfile.lock
            if bundle exec pod install 2>&1 | tee /tmp/pod-install.log; then
              exit 0
            fi

            if grep -q "pathname contains null byte" /tmp/pod-install.log; then
              echo "::warning::CocoaPods null-byte flake detected, retrying clean pod install..."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 3
              continue
            fi

            echo "::error::pod install failed with a non-retryable error."
            exit 1
          done

          echo "::error::pod install failed after ${MAX_ATTEMPTS} attempts due to CocoaPods null-byte flake."
          exit 1

      - name: Setup signing keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Fetch certificates
        working-directory: frontend/apps/mobile
        env:
          MATCH_KEYCHAIN_NAME: ${{ runner.temp }}/build.keychain-db
          MATCH_KEYCHAIN_PASSWORD: ""
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          MOBILE_MATCH_GIT_URL: ${{ secrets.MOBILE_MATCH_GIT_URL }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          ICE_CI_CD_BOT_GH_USERNAME: ${{ secrets.ICE_CI_CD_BOT_GH_USERNAME }}
          ICE_CI_CD_BOT_GH_PAT: ${{ secrets.ICE_CI_CD_BOT_GH_PAT }}
        run: |
          SECRETS_FILE=".env.secrets"
          if [[ ! -f "$SECRETS_FILE" ]]; then
            FALLBACK_SECRETS_FILE="../../.secrets/frontend/${INPUT_ENVIRONMENT}/mobile/.env.secrets"
            if [[ -f "$FALLBACK_SECRETS_FILE" ]]; then
              SECRETS_FILE="$FALLBACK_SECRETS_FILE"
            fi
          fi

          # setup-env.sh copies environment secrets to apps/mobile/.env.secrets.
          # Source secrets here so match-related variables are available in this step too.
          if [[ -f "$SECRETS_FILE" ]]; then
            # shellcheck disable=SC1091
            set -a && source "$SECRETS_FILE" && set +a
          fi

          if [[ -z "${MATCH_GIT_URL:-}" ]]; then
            export MATCH_GIT_URL="${MOBILE_MATCH_GIT_URL:-}"
          fi

          if [[ -z "${MATCH_GIT_URL:-}" ]]; then
            if grep -q "^[[:space:]]*git_url(" fastlane/Matchfile; then
              unset MATCH_GIT_URL
            else
              echo "::error::MATCH_GIT_URL is missing. Set MOBILE_MATCH_GIT_URL (or MATCH_GIT_URL) secret, or configure git_url(...) in fastlane/Matchfile."
              exit 1
            fi
          fi

          if [[ -n "${ICE_CI_CD_BOT_GH_PAT:-}" ]]; then
            # GitHub Actions runners don't have SSH keys for git@github.com URLs.
            # When PAT auth is available, force HTTPS so match can clone via header auth.
            if [[ "${MATCH_GIT_URL:-}" =~ ^git@github\.com:(.+)$ ]]; then
              export MATCH_GIT_URL="https://github.com/${BASH_REMATCH[1]}"
            elif [[ "${MATCH_GIT_URL:-}" =~ ^ssh://git@github\.com/(.+)$ ]]; then
              export MATCH_GIT_URL="https://github.com/${BASH_REMATCH[1]}"
            fi

            AUTH_USER="${ICE_CI_CD_BOT_GH_USERNAME:-x-access-token}"
            MATCH_GIT_BASIC_AUTHORIZATION="$(printf '%s' "${AUTH_USER}:${ICE_CI_CD_BOT_GH_PAT}" | base64 | tr -d '\n')"
            export MATCH_GIT_BASIC_AUTHORIZATION
          else
            unset MATCH_GIT_BASIC_AUTHORIZATION
          fi

          bundle exec fastlane ios fetch_certs

      - name: Allow codesign access
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Configure code signing
        working-directory: frontend/apps/mobile
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
        run: bundle exec fastlane ios setup_signing

      - name: Set app version
        working-directory: frontend/apps/mobile/ios
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
        run: |
          agvtool new-marketing-version "$INPUT_APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Archive
        working-directory: frontend/apps/mobile/ios
        env:
          IOS_SCHEME: ${{ needs.verify.outputs.ios_scheme }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$INPUT_ENVIRONMENT" in
            staging)    CONFIG_SUFFIX="Staging" ;;
            testnet)    CONFIG_SUFFIX="Testnet" ;;
            production) CONFIG_SUFFIX="Production" ;;
          esac

          xcodebuild archive \
            -workspace mobile.xcworkspace \
            -scheme "$IOS_SCHEME" \
            -configuration "Release-${CONFIG_SUFFIX}" \
            -archivePath build/Ion.xcarchive \
            -destination 'generic/platform=iOS' \
            -jobs 4 \
            -hideShellScriptEnvironment \
            CODE_SIGN_STYLE=Manual \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      - name: Generate export options
        working-directory: frontend/apps/mobile/ios
        env:
          INPUT_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$INPUT_DEPLOYMENT_TARGET" == "firebase" ]]; then
            METHOD="release-testing"
            SIGN_TYPE="AdHoc"
          else
            METHOD="app-store"
            SIGN_TYPE="AppStore"
          fi

          case "$INPUT_ENVIRONMENT" in
            staging)    BUNDLE_ID="io.ion.app.staging" ;;
            testnet)    BUNDLE_ID="io.ion.app.testnet" ;;
            production) BUNDLE_ID="io.ion.app" ;;
          esac

          PROFILE_NAME="match ${SIGN_TYPE} ${BUNDLE_ID}"

          cat > build/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>teamID</key>
            <string>YJJ6X8TG5Y</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: frontend/apps/mobile/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Ion.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Deploy to Firebase
        if: inputs.deployment_target == 'firebase'
        working-directory: frontend/apps/mobile
        env:
          RELEASE_NOTES: "${{ inputs.environment }}_${{ github.head_ref || github.ref_name }}"
        run: bundle exec fastlane ios distribute_firebase

      - name: Deploy to App Store
        if: inputs.deployment_target == 'store'
        working-directory: frontend/apps/mobile
        run: bundle exec fastlane ios distribute_appstore
