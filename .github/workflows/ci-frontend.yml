name: CI Frontend

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: getmac
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # CVE-2026-26278 (fast-xml-parser): dev-only transitive dep via @react-native-community/cli.
      # Parses local XML during builds, never ships in production. No patched 4.x exists;
      # fix requires major bump to 5.x which may break RN CLI. Ignored in pnpm.auditConfig.
      # Revisit when @react-native-community/cli updates its dependency.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm turbo test

      - name: Checkout secrets
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ice-blockchain/core-v2-secrets
          ref: master
          token: ${{ secrets.ICE_CI_CD_BOT_GH_PAT }}
          path: frontend/.secrets

      - name: Mask secrets
        working-directory: .
        run: |
          SECRETS_FILE="frontend/.secrets/frontend/staging/web/.env.secrets"
          if [[ -f "$SECRETS_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$value" || "$key" =~ ^# ]] && continue
              echo "::add-mask::${value}"
            done < "$SECRETS_FILE"
          fi

      - name: Setup web environment
        run: ./scripts/setup-env.sh staging

      - name: Build web
        run: pnpm turbo build --filter=@ion/web...

      - name: Bundle mobile (Metro)
        run: >
          pnpm --filter @ion/mobile exec
          react-native bundle
          --platform ios
          --dev false
          --entry-file index.js
          --bundle-output /tmp/ios.jsbundle
          --reset-cache
