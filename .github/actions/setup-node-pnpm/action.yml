name: Setup Node.js and pnpm
description: Install Node.js, pnpm, and project dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: 22

    - name: Setup pnpm
      uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5
      with:
        version: 10

    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile --fetch-retries=5 --fetch-timeout=120000
