services:
  relay-0:
    build:
      context: ../..
      dockerfile: bench/docker/Dockerfile
    environment:
      PEER_ID: relay-0
      PORT: "3000"
    ports:
      - "3100:3000"
    networks:
      - pulse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 2s
      timeout: 5s
      retries: 10

