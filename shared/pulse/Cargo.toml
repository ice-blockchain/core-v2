[workspace]
resolver = "2"
members = [
    "types",
    "auth",
    "transport",
    "graph",
    "kv",
    "vector",
    "analytics",
    "sql",
    "schema",
    "tenant",
    "signal",
    "shard",
    "federation",
    "reaper",
    "relay",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/niceguydave/ion-pulse"

[workspace.dependencies]
# Internal crates
pulse-types = { path = "types" }
pulse-auth = { path = "auth" }
pulse-transport = { path = "transport" }
pulse-graph = { path = "graph" }
pulse-kv = { path = "kv" }
pulse-vector = { path = "vector" }
pulse-analytics = { path = "analytics" }
pulse-sql = { path = "sql" }
pulse-schema = { path = "schema" }
pulse-tenant = { path = "tenant" }
pulse-signal = { path = "signal" }
pulse-shard = { path = "shard" }
pulse-federation = { path = "federation" }
pulse-reaper = { path = "reaper" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sodiumoxide = "0.2"

# Storage - LMDB
heed = "0.20"

# Storage - DuckDB
duckdb = { version = "1.1", features = ["bundled"] }

# Storage - Vector
lance = "0.20"
arrow = { version = "53", features = ["prettyprint"] }
arrow-schema = "53"
arrow-array = "53"

# SQL Engine
datafusion = "43"

# Transport
wtransport = "0.4"
quinn = "0.11"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Utilities
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
lru = "0.12"
governor = "0.7"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
bytes = "1"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }
