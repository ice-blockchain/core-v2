services:
  greenfield-ingester:
    build:
      context: ..
      dockerfile: services/greenfield-ingester/Dockerfile
    environment:
      GREENFIELD_RPC_URLS: ${GREENFIELD_RPC_URLS:-https://gnfd-testnet-fullnode-tendermint-us.bnbchain.org:443}
      GREENFIELD_CHAIN_ID: ${GREENFIELD_CHAIN_ID:-greenfield_5600-1}
      GREENFIELD_PRIVATE_KEY: ${GREENFIELD_PRIVATE_KEY}
      ONLINEIO_ENV: ${ONLINEIO_ENV:-dev}
      REDIS_URL: redis://:${REDIS_PASSWORD}@dragonfly:6379
      QUEUE_NAME: ${QUEUE_NAME:-greenfield-events}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health-check || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    container_name: greenfield-ingester

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    command: dragonfly --default_lua_flags=allow-undeclared-keys --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  greenfield-processor-1:
    build:
      context: ..
      dockerfile: services/greenfield-processor/Dockerfile
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@dragonfly:6379
      SOURCE_QUEUE_NAME: ${QUEUE_NAME:-greenfield-events}
      GREENFIELD_RPC_URL: ${GREENFIELD_RPC_URL:-https://gnfd-testnet-fullnode-tendermint-us.bnbchain.org:443}
      GREENFIELD_CHAIN_ID: ${GREENFIELD_CHAIN_ID:-greenfield_5600-1}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
      BUNNY_STORAGE_PASSWORD: ${BUNNY_STORAGE_PASSWORD}
      BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-ny}
      BUNNY_FTP_HOST: ${BUNNY_FTP_HOST:-storage.bunnycdn.com}
      FTP_MAX_CONNECTIONS: ${FTP_MAX_CONNECTIONS:-5}
      HTTP_UPLOAD_SIZE_LIMIT: ${HTTP_UPLOAD_SIZE_LIMIT:-52428800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      dragonfly:
        condition: service_healthy
    volumes:
      - greenfield-processor-tmp-1:/tmp/greenfield-processor
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health-check || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  greenfield-processor-2:
    build:
      context: ..
      dockerfile: services/greenfield-processor/Dockerfile
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@dragonfly:6379
      SOURCE_QUEUE_NAME: ${QUEUE_NAME:-greenfield-events}
      GREENFIELD_RPC_URL: ${GREENFIELD_RPC_URL:-https://gnfd-testnet-fullnode-tendermint-us.bnbchain.org:443}
      GREENFIELD_CHAIN_ID: ${GREENFIELD_CHAIN_ID:-greenfield_5600-1}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
      BUNNY_STORAGE_PASSWORD: ${BUNNY_STORAGE_PASSWORD}
      BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-ny}
      BUNNY_FTP_HOST: ${BUNNY_FTP_HOST:-storage.bunnycdn.com}
      FTP_MAX_CONNECTIONS: ${FTP_MAX_CONNECTIONS:-5}
      HTTP_UPLOAD_SIZE_LIMIT: ${HTTP_UPLOAD_SIZE_LIMIT:-52428800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      dragonfly:
        condition: service_healthy
    volumes:
      - greenfield-processor-tmp-2:/tmp/greenfield-processor
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health-check || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  ion-connect-storage:
    build:
      context: ..
      dockerfile: services/ion-connect-storage/Dockerfile
    environment:
      # Keys are read from secret files mounted at /run/secrets/.
      # The _FILE suffix tells config.go to read the file contents.
      ADNL_PRIVATE_KEY_FILE: /run/secrets/adnl_private_key
      ADNL_EXTERNAL_ADDR: ${ADNL_EXTERNAL_ADDR:-127.0.0.1:3278}
      PORT: ${ION_STORAGE_PORT:-3278}
      GLOBAL_CONFIG_URL: ${GLOBAL_CONFIG_URL:-https://ton.org/global-config.json}
      GREENFIELD_RPC_URLS: ${GREENFIELD_RPC_URLS:-https://gnfd-testnet-fullnode-tendermint-us.bnbchain.org:443}
      GREENFIELD_CHAIN_ID: ${GREENFIELD_CHAIN_ID:-greenfield_5600-1}
      GREENFIELD_PRIVATE_KEY_FILE: /run/secrets/greenfield_private_key
      ONLINEIO_ENV: ${ONLINEIO_ENV:-dev}
      CACHE_TTL: ${CACHE_TTL:-24h}
      CACHE_DIR: /data/cache
      DATA_DIR: /data/db
      ACTIVE_DHT_LIMIT: ${ACTIVE_DHT_LIMIT:-100000}
      HTTP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    secrets:
      - adnl_private_key
      - greenfield_private_key
    ports:
      - "127.0.0.1:${ION_STORAGE_PORT:-3278}:${ION_STORAGE_PORT:-3278}/udp"
    volumes:
      - ion-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health-check || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    container_name: ion-connect-storage

secrets:
  adnl_private_key:
    file: ${ADNL_PRIVATE_KEY_FILE:-.secrets/adnl_private_key}
  greenfield_private_key:
    file: ${GREENFIELD_PRIVATE_KEY_FILE:-.secrets/greenfield_private_key}

volumes:
  dragonfly-data:
  greenfield-processor-tmp-1:
  greenfield-processor-tmp-2:
  ion-storage-data:
