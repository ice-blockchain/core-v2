apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// env setup step places the correct .env at apps/mobile/.env before build.
// All variants read the same file — env selection is done by scripts/setup-env.sh.
project.ext.envConfigFiles = [
    stagingDebug:        "../../.env",
    stagingRelease:      "../../.env",
    ionTestnetDebug:     "../../.env",
    ionTestnetRelease:   "../../.env",
    productionDebug:     "../../.env",
    productionRelease:   "../../.env",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Variants */
    debuggableVariants = ["stagingDebug", "ionTestnetDebug", "productionDebug"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def signingProps = new Properties()
def signingPropsFile = file("../key.properties")
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "io.ion.app"
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "environment"
    productFlavors {
        staging {
            dimension "environment"
            applicationId "io.ion.app.staging"
            resValue "string", "app_name", "ION Staging"
        }
        ionTestnet {
            dimension "environment"
            applicationId "io.ion.app.testnet"
            resValue "string", "app_name", "ION Testnet"
        }
        production {
            dimension "environment"
            applicationId "io.ion.app"
            resValue "string", "app_name", "ION"
        }
    }

    signingConfigs {
        release {
            if (signingPropsFile.exists()) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
